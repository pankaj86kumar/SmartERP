services:

  smarterp:
    build: .
    container_name: smarterp
    ports:
      - "8080:80"
    depends_on:
      - database

  database:
    image: mysql:8.0
    container_name: smarterp-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: SmartERP@123
      MYSQL_DATABASE: smarterp
      MYSQL_USER: smarterp
      MYSQL_PASSWORD: SmartERP@123
    volumes:
      - smarterp_data:/var/lib/mysql

volumes:
  smarterp_data:
    external: true